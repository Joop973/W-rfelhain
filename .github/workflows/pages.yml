# E1 (10 Etappe E): GitHub-Pages-Deployment — statische Web-App ohne Build-Step
# (09 §1), das Repo-Wurzelverzeichnis IST das Artefakt. Aktivierung liegt beim
# Repo-Besitzer: Settings → Pages → Source "GitHub Actions" (Plan 10: E1,
# "du aktivierst Pages und entscheidest den Merge").
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: . # kein Build — die Wurzel ist die App (index.html + ES-Module)
      - id: deployment
        uses: actions/deploy-pages@v4
